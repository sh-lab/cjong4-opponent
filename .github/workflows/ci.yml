name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: GCC / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_C_EXTENSIONS=OFF
          -DCMAKE_C_FLAGS="-Werror -Wvla"
          -DCJ4_OPPONENT_BUILD_TESTS=ON
          -DCJ4_OPPONENT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/build/install"

      - name: Configure installed-package consumer
        run: >
          cmake -S tests/package_consumer -B build/consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"

      - name: Build installed-package consumer
        run: cmake --build build/consumer --parallel

      - name: Test installed-package consumer
        run: ctest --test-dir build/consumer --output-on-failure

      - name: Configure with installed cjong4
        run: >
          cmake -S . -B build-system
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCJ4_OPPONENT_USE_SYSTEM_CJONG4=ON
          -DCJ4_OPPONENT_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"

      - name: Build with installed cjong4
        run: cmake --build build-system --parallel

      - name: Test with installed cjong4
        run: ctest --test-dir build-system --output-on-failure

  clang-sanitizers:
    name: Clang / ASan+UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_EXTENSIONS=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCJ4_OPPONENT_BUILD_TESTS=ON
          -DCJ4_OPPONENT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  msvc:
    name: MSVC / Windows
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_C_EXTENSIONS=OFF
          -DCJ4_OPPONENT_BUILD_TESTS=ON
          -DCJ4_OPPONENT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
